# Optional local PostgreSQL for development.
#   docker compose up -d db
# Matches the default DATABASE_URL in apps/api/.env.example.
services:
  db:
    image: postgres:16-alpine
    container_name: cognitia-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cognitia
    ports:
      - "5432:5432"
    volumes:
      - cognitia-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cognitia"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  cognitia-db:
